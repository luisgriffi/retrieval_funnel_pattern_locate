[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luisgriffi-retrieval_funnel_pattern_locate"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告算子库维护工程师·检索召回的漏斗分析相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "luisgriffi" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://luisgriffi.github.io"
Repository = "https://github.com/luisgriffi/retrieval_funnel_pattern_locate"
Issues = "https://github.com/luisgriffi/retrieval_funnel_pattern_locate/issues"

[project.scripts]
retrieval_funnel_pattern_locate = "retrieval_funnel_pattern_locate:main"

[tool.setuptools]
py-modules = ["retrieval_funnel_pattern_locate"]
